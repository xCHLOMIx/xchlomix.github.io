<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/transactions.css">
    <title>Fynance - Transactions</title>
</head>

<body>
    <header>
        <a href="../index.html">
            <h1>Fynance</h1>
        </a>
        <a href="/pages/about.html">
            <button>
                <div>
                    <img src="../assets/icons/user.png" alt="">
                </div>
                <span>About the Dev</span>
            </button>
        </a>
    </header>
    <main>
        <nav>
            <div>
                <a href="/pages/dashboard.html">
                    <li>
                        <img src="../assets/icons/home.png" alt="">
                        <span>Dashboard</span>
                    </li>
                </a>
                <a href="/pages/budgets.html">
                    <li>
                        <img src="../assets/icons/budget.png" alt="">
                        <span>Budgets</span>
                    </li>
                </a>
                <a href="">
                    <li class="active">
                        <img src="../assets/icons/transaction.png" alt="">
                        <span>Transactions</span>
                    </li>
                </a>
                <a href="settings.html" id="settings-1">
                    <li>
                        <img src="../assets/icons/settings.png" alt="">
                        <span>Settings</span>
                    </li>
                </a>
            </div>
            <a href="settings.html" id="settings-2">
                <li>
                    <img src="../assets/icons/settings.png" alt="">
                    <span>Settings</span>
                </li>
            </a>
        </nav>
        <section>
            <div class="head">
                <h1>Transactions</h1>
                <div class="buttons">
                    <button class="primary hid" id="export">
                        <img src="../assets/icons/export.png" alt="Export icon">
                        <span>Export</span>
                    </button>
                    <button class="primary" id="add_transaction">
                        <img src="../assets/icons/plus.png" alt="Add icon">
                        <span>New transaction</span>
                    </button>
                    <button class="primary" id="import">
                        <img src="../assets/icons/import.png" alt="Import icon">
                        <span>Import</span>
                    </button>
                </div>
            </div>
            <!-- The side form - a pain to implement btw :(  -->
            <div id="form-container" class="hidden form-container">
                <div class="head">
                    <h2>New transaction</h2>
                    <button id="form_close">
                        <img src="../assets/icons/black_plus.png" alt="Black Add icon">
                    </button>
                </div>
                <form id="form">
                    <div class="field">
                        <label for="amount">Amount ($):</label>
                        <input type="text" id="amount" pattern="^(0|[1-9]\d*)(\.\d{1,2})?$"
                            title="Must be a numeric value and not have more than 2 decimal places" placeholder="Example: 500" required>
                    </div>
                    <div class="field">
                        <label for="description">Description:</label>
                        <input type="text" minlength="3" id="description" pattern="^\S(?:.*\S)?$"
                            title="No trailing/leading spaces or collapse doubles allowed."
                            placeholder="Example: Lunch at KFC" required>
                    </div>
                    <div class="selects" id="select_container">
                        <div class="field">
                            <label for="category">Category:</label>
                            <select name="category" id="category" required>
                                <option value="">Select category</option>
                                <option value="food">Food</option>
                                <option value="books">Books</option>
                                <option value="transport">Transport</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="fees">Fees</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="field hidd" id="others-input">
                        <label for="others">Others</label>
                        <input type="text" pattern="^[A-Za-z]+(?:[ \-][A-Za-z]+)*$" title="Only letters, spaces and hyphens '-'" id="others" placeholder="Others: Clothing">
                    </div>
                    <button type="submit" class="primary">Submit</button>
                </form>
            </div>
            <div class="container">
                <div class="options hidd" id="options-container">
                    <div class="search">
                        <label for="search">Search Transactions:</label>
                        <input type="text" name="search" id="search" placeholder="Example: Pizza">
                    </div>
                    <div>
                        <div class="field">
                            <label for="sorting">Sort by:</label>
                            <select name="sorting" id="sorting">
                                <option value="description-a">Description (A-Z)</option>
                                <option value="description-d">Description (Z-A)</option>
                                <option value="amount-a">Amount &UpArrow;</option>
                                <option value="amount-d">Amount &DownArrow;</option>
                                <option value="createdAt-a">Created at (Newest to Oldest)</option>
                                <option value="createdAt-d">Create at (Oldest to Newest)</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <thead>
                                <tr>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Category</th>
                                    <th>Created at</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                        <tbody id="table">
                            <tr>
                                <td colspan="5" style="text-align: center; color: grey;">No transactions</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <script src="../scripts/transactions.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/transactions.css">
    <title>Fynance - Budgets</title>
</head>

<body>
    <header>
        <a href="../index.html">
            <h1>Fynance</h1>
        </a>
        <a href="/pages/about.html">
            <button>
                <div>
                    <img src="../assets/icons/user.png" alt="">
                </div>
                <span>About the Dev</span>
            </button>
        </a>
    </header>
    <main>
        <nav>
            <div>
                <a href="/pages/dashboard.html">
                    <li>
                        <img src="../assets/icons/home.png" alt="">
                        <span>Dashboard</span>
                    </li>
                </a>
                <a href="/pages/budgets.html">
                    <li class="active">
                        <img src="../assets/icons/budget.png" alt="">
                        <span>Budgets</span>
                    </li>
                </a>
                <a href="/pages/transactions.html">
                    <li>
                        <img src="../assets/icons/transaction.png" alt="">
                        <span>Transactions</span>
                    </li>
                </a>
                <a href="/pages/settings.html" id="settings-1">
                    <li>
                        <img src="../assets/icons/settings.png" alt="">
                        <span>Settings</span>
                    </li>
                </a>
            </div>
            <a href="/pages/settings.html" id="settings-2">
                <li>
                    <img src="../assets/icons/settings.png" alt="">
                    <span>Settings</span>
                </li>
            </a>
        </nav>
        <section>
            <div class="head">
                <h1>Budgets</h1>
                <div class="buttons">
                    <button class="primary hid" id="export">
                        <img src="../assets/icons/export.png" alt="Export icon">
                        <span>Export</span>
                    </button>
                    <button class="primary" id="add_budget">
                        <img src="../assets/icons/plus.png" alt="Add icon">
                        <span>New budget</span>
                    </button>
                    <button class="primary" id="import">
                        <img src="../assets/icons/import.png" alt="Import icon">
                        <span>Import</span>
                    </button>
                </div>
            </div>
            <div class="hidden form-container" id="form-container">
                <div class="head">
                    <h2>New budget</h2>
                    <button id="form_close">
                        <img src="../assets/icons/black_plus.png" alt="Black Add icon">
                    </button>
                </div>
                <form id="form">
                    <div class="error hidd" id="error"></div>
                    <div class="field">
                        <label for="name">Budget name:</label>
                        <input type="text" name="name" pattern="^[A-Za-z]+(?:[ \-][A-Za-z]+)*$"
                            title="Names can only contain letter, spaces and hyphens '-'" id="name"
                            placeholder="Ex: June Budget" autocomplete="name" required>
                    </div>
                    <div class="group">
                        <div class="field">
                            <label for="start_date">Start date:</label>
                            <input type="text" pattern="^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$"
                                title="Date pattern is YYYY-MM-DD" name="start_date" id="start_date"
                                placeholder="Ex: 2026-08-03" required>
                        </div>
                        <div class="field">
                            <label for="end_date">End date:</label>
                            <input type="text" name="end_date" id="end_date"
                                pattern="^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$"
                                title="Date pattern is YYYY-MM-DD" placeholder="Ex: 2026-09-03" required>
                        </div>
                    </div>
                    <div class="group">
                        <div class="field">
                            <label for="food">Food budget ($)</label>
                            <input type="text" name="food" id="food" pattern="^(0|[1-9]\d*)(\.\d{1,2})?$"
                                title="Must be a numeric value with max 2 decimal places" placeholder="Example: 500" required>
                        </div>
                        <div class="field">
                            <label for="books">Books budget ($)</label>
                            <input type="text" name="books" id="books" pattern="^(0|[1-9]\d*)(\.\d{1,2})?$"
                                title="Must be a numeric value with max 2 decimal places" placeholder="Example: 40" required>
                        </div>
                    </div>
                    <div class="field">
                        <label for="transport">Transport budget ($)</label>
                        <input type="text" name="transport" id="transport" pattern="^(0|[1-9]\d*)(\.\d{1,2})?$"
                            title="Must be a numeric value with max 2 decimal places" placeholder="Example: 5" required>
                    </div>
                    <div class="field">
                        <label for="entertainment">Entertainment budget ($)</label>
                        <input type="text" name="entertainment" id="entertainment"
                            pattern="^(0|[1-9]\d*)(\.\d{1,2})?$" title="Must be a numeric value with max 2 decimal places"
                            placeholder="Example: 3" required>
                    </div>
                    <div class="group">
                        <div class="field">
                            <label for="fees">Fees budget ($)</label>
                            <input type="text" name="fees" id="fees" pattern="^(0|[1-9]\d*)(\.\d{1,2})?$"
                                title="Must be a numeric value with max 2 decimal places" placeholder="Example: 660" required>
                        </div>
                        <div class="field">
                            <label for="others">Others ($)</label>
                            <input type="text" name="others" id="others" pattern="^(0|[1-9]\d*)(\.\d{1,2})?$"
                                title="Must be a numeric value with max 2 decimal places" placeholder="Example: 40" required>
                        </div>
                    </div>
                    <button type="submit" class="primary">Submit</button>
                </form>
            </div>
            <div class="container">
                <div class="options hidd" id="options">
                    <div class="search">
                        <label for="search">Search Budgets:</label>
                        <input type="text" name="search" id="search" placeholder="Example: June budget">
                    </div>
                    <div>
                        <div class="field">
                            <label for="sorting">Sort by:</label>
                            <select name="" id="sorting">
                                <option value="name-a">Name (A-Z)</option>
                                <option value="name-d">Name (Z-A)</option>
                                <option value="start_date-a">Start Date (Newest to Oldest)</option>
                                <option value="start_date-d">Start Date (Oldest to Newest)</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Food</th>
                                <th>Books</th>
                                <th>Transport</th>
                                <th>Entertainment</th>
                                <th>Fees</th>
                                <th>Other</th>
                                <th>Start Date</th>
                                <th>End Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="table">
                            <tr>
                                <td colspan="10" style="text-align: center; color: grey;">No budgets</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <script src="../scripts/budgets.js"></script>
</body>

</html>
